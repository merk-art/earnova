
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Earnova</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header>
        <nav class="navbar">

            <h2 class="logo">Earnova<span>.</span></h2>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </div>

        </nav>
    </header>


    <!-- REGISTRATION SECTION -->
    <section class="register-section">

        <div class="register-container">

            <h1>Create Your Account</h1>

            <p>Join Earnova and explore digital opportunities.</p>

            <form id="register-form">

                <div class="form-group">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 07XXXXXXXX"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Create Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="referral">Referral Code (Optional)</label>

                    <input
                        type="text"
                        id="referral"
                        name="referral"
                        placeholder="Enter referral code"
                    >
                </div>


                <div class="terms">
                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the Terms and Conditions.
                    </label>
                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="login-link">
                Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Earnova. All rights reserved.</p>
        <p>Digital Opportunities. Real Value.</p>
    </footer>


    <!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- EARNOVA SUPABASE CONNECTION -->
<script src="js/supabase.js"></script>

<!-- MAIN JAVASCRIPT -->
<script src="js/script.js"></script>

</body>
</html>
